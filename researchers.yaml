# Researchers whose recent arXiv papers are tracked for paper-viewer's
# Researchers page. Focus: LLM/AI systems (serving, training systems, efficient
# inference, OS and infrastructure for AI, agent systems).
#
# match:
#   name    the name is unique among DBLP authors; a cs paper under the name is theirs
#   school  homonyms exist elsewhere; the arXiv HTML author block must name the school
#   strict  a homonym works at the same school; school AND a known DBLP coauthor
# schools: regular expressions tried against the HTML author block.
#   Keep them in single quotes: in double quotes YAML turns \b into a backspace.
researchers:
  - slug: ion-stoica
    name: Ion Stoica
    dblp_pid: s/IonStoica
    affiliation: UC Berkeley
    known_for: Spark, Ray, vLLM · co-founded Databricks and Anyscale
    match: name
  - slug: matei-zaharia
    name: Matei Zaharia
    dblp_pid: 36/2133
    affiliation: UC Berkeley
    known_for: Created Apache Spark · Databricks CTO
    match: name
  - slug: christos-kozyrakis
    name: Christos Kozyrakis
    dblp_pid: k/ChristoforosEKozyrakis
    affiliation: Stanford
    known_for: Computer architecture and datacenter systems
    match: name
  - slug: tianqi-chen
    name: Tianqi Chen
    dblp_pid: 94/8023-1
    affiliation: Carnegie Mellon
    known_for: XGBoost, TVM, MXNet
    match: school
    schools: ['\bCMU\b', 'Carnegie Mellon']
  - slug: zhihao-jia
    name: Zhihao Jia
    dblp_pid: 129/3026
    affiliation: Carnegie Mellon
    known_for: FlexFlow, TASO, SpecInfer
