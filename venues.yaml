SOSP:
  type: conf
  key: "conf/sosp/sosp{year}"
  fallback_url: "https://www.sigops.org/s/conferences/sosp/{year}/accepted.html"
  status: {2025: indexed, 2026: pending}

OSDI:
  type: conf
  key: "conf/osdi/osdi{year}"
  fallback_url: "https://www.usenix.org/conference/osdi{yy}/technical-sessions"
  status: {2025: indexed, 2026: pending}

# USENIX retired ATC after its 50th edition in 2025; ACM SIGOPS picked it up
# after a community petition. So there is no USENIX ATC 2026 and the key
# conf/usenix/usenix2026 will never exist (usenix.org/conference/atc26 redirects
# to atc25 with a 301). The submissions ATC used to absorb went to OSDI, which
# is why OSDI '26 lists about 136 papers against OSDI '25's 53.
# Only 2025 is kept here. The SIGOPS successor is a separate venue and needs its
# own DBLP key looked up before it can be added.
ATC:
  type: conf
  key: "conf/usenix/usenix{year}"
  status: {2025: indexed}

NSDI:
  type: conf
  key: "conf/nsdi/nsdi{year}"
  status: {2025: indexed, 2026: indexed}

EuroSys:
  type: conf
  key: "conf/eurosys/eurosys{year}"
  status: {2025: indexed, 2026: indexed}

ASPLOS:
  type: conf
  key: "conf/asplos/asplos{year}-{vol}"
  volumes: auto
  index: "conf/asplos"
  status: {2025: indexed, 2026: partial}

SIGMOD:
  type: journal_rounds
  key: "journals/pacmmod/pacmmod{vol}"
  rounds:
    2026: [[3, 4], [3, 6], [4, 1], [4, 3]]
  official_url: "https://{year}.sigmod.org/sigmod_papers.shtml"
  status: {2026: partial}

VLDB:
  type: journal_volume
  key: "journals/pvldb/pvldb{vol}"
  vol_for_year: {2025: 18, 2026: 19}
  note_template: "This file is all of PVLDB vol {vol}. The VLDB {year} research track is really the papers accepted before this volume's cutoff plus rollovers from the previous volume, a distinction DBLP metadata does not record."
  status: {2025: indexed, 2026: partial}
