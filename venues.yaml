SOSP:
  type: conf
  key: "conf/sosp/sosp{year}"
  fallback_url: "https://www.sigops.org/s/conferences/sosp/{year}/accepted.html"
  status: {2025: indexed, 2026: pending}

OSDI:
  type: conf
  key: "conf/osdi/osdi{year}"
  fallback_url: "https://www.usenix.org/conference/osdi{yy}/technical-sessions"
  status: {2025: indexed, 2026: pending}

# USENIX ATC 在 2025 年办完第 50 届后停办，ACM SIGOPS 应社区请愿接手续办。
# 因此 2026 没有 USENIX ATC：conf/usenix/usenix2026 这个 key 永远不会出现
# （usenix.org/conference/atc26 实测 301 重定向到 atc25），ATC 停办后的投稿量
# 被 OSDI 吸收——OSDI '26 官网列出约 136 篇，而 OSDI '25 只有 53 篇。
# 只保留 2025；SIGOPS 续办的那个是另一个 venue，需要单独查 DBLP key 后再加。
ATC:
  type: conf
  key: "conf/usenix/usenix{year}"
  status: {2025: indexed}

NSDI:
  type: conf
  key: "conf/nsdi/nsdi{year}"
  status: {2025: indexed, 2026: indexed}

EuroSys:
  type: conf
  key: "conf/eurosys/eurosys{year}"
  status: {2025: indexed, 2026: indexed}

ASPLOS:
  type: conf
  key: "conf/asplos/asplos{year}-{vol}"
  volumes: auto
  index: "conf/asplos"
  status: {2025: indexed, 2026: partial}

SIGMOD:
  type: journal_rounds
  key: "journals/pacmmod/pacmmod{vol}"
  rounds:
    2026: [[3, 4], [3, 6], [4, 1], [4, 3]]
  official_url: "https://{year}.sigmod.org/sigmod_papers.shtml"
  status: {2026: partial}

VLDB:
  type: journal_volume
  key: "journals/pvldb/pvldb{vol}"
  vol_for_year: {2025: 18, 2026: 19}
  note_template: "本文件为 PVLDB vol {vol} 全卷。VLDB {year} 研究 track 实际由本卷截止日前接收的论文加上一卷的 rollover 组成，DBLP 元数据无法区分。"
  status: {2025: indexed, 2026: partial}
