name: Update paper lists

on:
  schedule:
    # 03:00 UTC on the 1st. Accepted lists change on the scale of months, so
    # anything more frequent just walks into DBLP's rate limiting for nothing.
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# DBLP is sensitive to concurrent requests; two overlapping syncs only slow each
# other down and trigger rate limiting.
concurrency:
  group: update-paper-lists
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A run takes well over ten minutes once DBLP backoff stacks on throttling.
    # The 6-hour default is far too loose and 10 minutes is too tight.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # The tests run entirely offline against fixtures, so they make a cheap
      # gate in front of the sync.
      - name: Run tests
        run: python -m pytest

      # Never pass --allow-shrink here: a drop in paper count has to be
      # confirmed by a person, or one truncated response quietly wipes out a
      # whole edition.
      - name: Sync from DBLP
        id: sync
        run: python update.py sync
        continue-on-error: true

      # Editions DBLP has not indexed are scraped from the conference site,
      # which carries titles and authors but no links. Missing links are matched
      # by title against Semantic Scholar, usually landing on the authors' own
      # arXiv preprint, and PDF URLs are derived from the links we have.
      # No continue-on-error: this step always exits 0 on its own, because a
      # link it could not find is not a failure.
      - name: Fill in missing paper links
        run: python update.py enrich
        env:
          # Optional. Semantic Scholar's anonymous quota is shared with every
          # other caller on the internet and a full run sits at 429 for most of
          # its length; a free key lifts that. An unset secret is an empty
          # string, which the code treats as "no key" — the step still works,
          # just slower.
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}

      # Commit whatever succeeded even if some venues failed; the next run
      # picks up the rest.
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data papers README.md
          git diff --staged --quiet || git commit -m "data: monthly sync $(date -u +%Y-%m-%d)"
          git push

      - name: Open issue on failure
        if: steps.sync.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sync reported failures on ${new Date().toISOString().slice(0, 10)}`,
              body: [
                'The monthly sync finished with at least one failing venue-year.',
                '',
                `Run log: ${run}`,
                '',
                'Common causes, in rough order of likelihood:',
                '',
                '- **Rate limiting.** DBLP answers overload with 429 or 503, or stops',
                '  answering at all. Usually transient — re-run the workflow.',
                '- **MappingDrift.** A venue marked `indexed` returned zero papers,',
                '  meaning its DBLP TOC key changed. Fix the key in `venues.yaml`.',
                '- **ShrinkRejected.** Fewer papers than are already stored. Existing',
                '  data was kept. If the drop is legitimate (usually a `venues.yaml`',
                '  edit), re-run locally with `--allow-shrink` once and commit.',
              ].join('\n'),
            })
