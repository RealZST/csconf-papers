name: Update paper lists

on:
  schedule:
    # 每月 1 日 03:00 UTC。录用名单以月为单位变化，更频繁只会白白撞 DBLP 的限流。
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# DBLP 对并发请求很敏感，两轮同步撞在一起只会互相拖慢并触发限流。
concurrency:
  group: update-paper-lists
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 实测：DBLP 退避叠加节流后单轮可达十几分钟，默认 6 小时太宽、10 分钟太紧。
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # 测试全部离线跑 fixture，不碰网络，所以放在同步之前当门禁。
      - name: Run tests
        run: python -m pytest

      # 绝不加 --allow-shrink：篇数下降必须由人确认一次，否则一个半截响应
      # 就能悄悄抹掉一整届的论文。
      - name: Sync from DBLP
        id: sync
        run: python update.py sync
        continue-on-error: true

      # 即使部分 venue 失败也提交已成功的部分——下一轮会把缺的补上。
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data papers README.md
          git diff --staged --quiet || git commit -m "data: monthly sync $(date -u +%Y-%m-%d)"
          git push

      - name: Open issue on failure
        if: steps.sync.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sync reported failures on ${new Date().toISOString().slice(0, 10)}`,
              body: [
                'The monthly sync finished with at least one failing venue-year.',
                '',
                `Run log: ${run}`,
                '',
                'Common causes, in rough order of likelihood:',
                '',
                '- **Rate limiting.** DBLP answers overload with 429 or 503, or stops',
                '  answering at all. Usually transient — re-run the workflow.',
                '- **MappingDrift.** A venue marked `indexed` returned zero papers,',
                '  meaning its DBLP TOC key changed. Fix the key in `venues.yaml`.',
                '- **ShrinkRejected.** Fewer papers than are already stored. Existing',
                '  data was kept. If the drop is legitimate (usually a `venues.yaml`',
                '  edit), re-run locally with `--allow-shrink` once and commit.',
              ].join('\n'),
            })
